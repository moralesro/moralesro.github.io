const C=document.getElementById('c'),X=C.getContext('2d');
const W=320,H=192,T=16,ROOF=118;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);C.style.width=Math.floor(W*s)+'px';C.style.height=Math.floor(H*s)+'px';X.imageSmoothingEnabled=false;}
addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>v<a?a:v>b?b:v, mod=(a,n)=>((a%n)+n)%n, rnd=Math.random;
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

const KM={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowDown:'D',KeyS:'D',ArrowUp:'J',KeyW:'J',Space:'J',KeyZ:'J',
  KeyX:'F',KeyJ:'F',KeyC:'SW',KeyK:'SW',KeyQ:'SW',Enter:'ST',KeyM:'M',KeyP:'P',Escape:'P'};
function press(k){if(!held[k])just[k]=true;held[k]=true;initAudio();}
function release(k){held[k]=false;}
addEventListener('keydown',e=>{const k=KM[e.code];if(k){e.preventDefault();press(k);}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k){e.preventDefault();release(k);}});
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();press(k);});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>release(k)));});
C.addEventListener('pointerdown',()=>{press('ST');setTimeout(()=>release('ST'),60);});

/* ---------------- AUDIO CHIPTUNE ---------------- */
let AC=null,master=null,musicOn=true,MUS_TR=0,step=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{ if('audioSession' in navigator)navigator.audioSession.type='playback';
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){}
}
function beep(f,d=.08,type='square',v=.12,slide=0){
  if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.02);
}
function noise(d=.15,v=.2){
  if(!AC)return;const b=AC.createBuffer(1,Math.floor(AC.sampleRate*d),AC.sampleRate),ch=b.getChannelData(0);
  for(let i=0;i<ch.length;i++)ch[i]=(rnd()*2-1)*(1-i/ch.length);
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=v;s.connect(g).connect(master);s.start();
}
const SFX={
  jump:()=>beep(280,.12,'square',.1,420), shoot:()=>beep(900,.05,'square',.06,-500),
  hit:()=>beep(220,.05,'square',.08,-100), kill:()=>{noise(.18,.22);beep(160,.18,'square',.08,-90);},
  hurt:()=>{beep(190,.25,'sawtooth',.13,-120);noise(.1,.12);}, pick:()=>{beep(880,.06);setTimeout(()=>beep(1320,.08),60);},
  power:()=>[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.1,'square',.1),i*70)), boom:()=>noise(.7,.4)
};
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MEL=[72,0,76,79,84,79,76,0,74,0,77,81,86,81,77,0,76,0,79,83,88,83,79,76,74,76,77,79,74,0,0,0];
const BAS=[48,48,48,48,53,53,53,53,55,55,55,55,48,48,55,55];
setInterval(()=>{
  if(!AC||!musicOn||!['play','truck','title'].includes(state))return;
  const m=MEL[step%32];if(m)beep(mtof(m+MUS_TR),.11,'square',.035);
  if(step%2===0)beep(mtof(BAS[(step>>1)%16]+MUS_TR-12),.2,'triangle',.07);
  step++;
},140);

/* ---------------- SPRITES (pixel art) ---------------- */
const PAL={k:'#14141c',w:'#ffffff',s:'#f4b886',h:'#5a3418',y:'#f8c820',b:'#2a5bd7',p:'#2d3047',n:'#6b3e1e',

function mk(name,rows,over){
  const pal=Object.assign({},PAL,over||{}),h=rows.length,w=rows[0].length;
  const a=document.createElement('canvas');a.width=w;a.height=h;const ax=a.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch!=='.'&&pal[ch]){ax.fillStyle=pal[ch];ax.fillRect(i,j,1,1);}}
  const b=document.createElement('canvas');b.width=w;b.height=h;const bx=b.getContext('2d');
  bx.translate(w,0);bx.scale(-1,1);bx.drawImage(a,0,0);SPR[name]=[a,b];
}
function spr(name,x,y,flip){const s=SPR[name];if(s)X.drawImage(s[flip?1:0],Math.round(x),Math.round(y));}

/* ---------------- CONSTRUCCIÓN DE NIVELES ---------------- */
function newLvl(w){const g=[];for(let y=0;y<12;y++)g.push(new Array(w).fill('.'));return {g,w,en:[],it:[],exit:null};}
function F(l,x1,x2,y1,y2,ch){for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)if(x>=0&&x<l.w&&y>=0&&y<12)l.g[y][x]=ch;}
function mkEnemy(type,x,y){const d=ED[type];
  return {type,x,y,w:d.w,h:d.h,hp:d.hp,vx:-d.sp,vy:0,sp:d.sp,shoot:d.shoot||0,fly:!!d.fly,boss:!!d.boss,
    score:d.score,t:Math.floor(rnd()*60),fl:0,by:y,ox:x,dead:false,on:false};}
function E(l,type,tx,ty=9){l.en.push(mkEnemy(type,tx*T,(ty+1)*T-ED[type].h));}
function I(l,t,tx,ty){l.it.push({t,x:tx*T+2,y:ty*T+2,w:12,h:12,bob:rnd()*6});}

function startLevel(){
  const d=LV[lvlIdx];MUS_TR=d.tr;
  Object.assign(p,{has:[...snap.has],ammo:snap.ammo,wp:snap.wp,harness:snap.harness,hp:p.max,inv:0,vx:0,vy:0,h:15,duck:false,drop:0});

  L=d.build();L.theme=d.theme;en=L.en;it=L.it;scene='level';
  p.x=L.start.x;p.y=L.start.y;p.safe={x:p.x,y:p.y};cam=0;state='play';

/* ---------------- FÍSICA / COLISIONES ---------------- */
function tile(tx,ty){if(!L||ty<0||ty>=12)return '.';if(tx<0||tx>=L.w)return '#';return L.g[ty][tx];}
const isSolid=ch=>ch==='#'||ch==='I'||ch==='C';
function solidAt(px,py){const ch=tile(Math.floor(px/T),Math.floor(py/T));return isSolid(ch)||ch==='=';}
function hits(o){const x0=Math.floor(o.x/T),x1=Math.floor((o.x+o.w-1)/T),y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-1)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(isSolid(tile(tx,ty)))return true;return false;}
function landsOneway(o,pb){if(o.drop>0)return false;const b=o.y+o.h,ty=Math.floor((b-1)/T),top=ty*T;
  if(pb>top||b<=top)return false;const x0=Math.floor(o.x/T),x1=Math.floor((o.x+o.w-1)/T);
  for(let tx=x0;tx<=x1;tx++)if(tile(tx,ty)==='=')return true;return false;}
function move(o,dx,dy){
  o.hitWall=false;let s=Math.sign(dx),a=Math.abs(dx);
  while(a>0){const st=Math.min(1,a);o.x+=s*st;if(hits(o)){o.x-=s*st;o.hitWall=true;break;}a-=st;}
  o.on=false;s=Math.sign(dy);a=Math.abs(dy);

    if(hits(o)||(s>0&&landsOneway(o,pb))){o.y-=s*st;if(s>0)o.on=true;o.vy=0;break;}a-=st;}
}
function standOn(ch){const ty=Math.floor((p.y+p.h+1)/T),x0=Math.floor(p.x/T),x1=Math.floor((p.x+p.w-1)/T);
  for(let tx=x0;tx<=x1;tx++)if(tile(tx,ty)===ch)return true;return false;}
function hazard(o){const x0=Math.floor(o.x/T),x1=Math.floor((o.x+o.w-1)/T),y0=Math.floor(o.y/T),y1=Math.floor((o.y+o.h-1)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(tile(tx,ty)==='S'&&o.y+o.h>ty*T+8)return true;return false;}

/* ---------------- JUGADOR ---------------- */
function hurt(n,src){
  if(p.inv>0||state==='end')return;p.hp-=n;p.inv=70;SFX.hurt();shake=8;
  if(navigator.vibrate)navigator.vibrate(60);
  p.vy=-3.5;p.vx=src!==undefined?(p.x+5<src?-2.2:2.2):-p.face*2;
  if(p.hp<=0){p.hp=0;deaths++;paused=state;state='dead';}
}
function fire(){
  const w=WP[p.wp];if(w.ammo&&p.ammo<=0){p.wp=0;return;}
  p.cd=w.cd;const bx=p.face>0?p.x+p.w:p.x-5,by=p.y+(p.duck?4:7);
  (w.spread?[-1,0,1]:[0]).forEach(s=>bl.push({x:bx,y:by,vx:w.spd*p.face,vy:s*.9,w:5,h:3,l:w.life,d:w.dmg,c:w.c}));
  if(w.ammo){p.ammo--;if(p.ammo<=0){p.ammo=0;p.wp=0;flash('SIN MUNICIÓN');}}SFX.shoot();
}
function switchW(){for(let k=1;k<=3;k++){const n=(p.wp+k)%3;if(p.has[n]&&(n===0||p.ammo>0)){if(n!==p.wp){p.wp=n;beep(660,.05);}break;}}}
function updPlayer(tm){
  const ice=!tm&&p.on&&standOn('I'),conv=!tm&&p.on&&standOn('C');
  const want=(held.D&&p.on)?10:15;
  if(want!==p.h){const ny=p.y+p.h-want;if(tm||!hits({x:p.x,y:ny,w:p.w,h:want})){p.y=ny;p.h=want;}}
  p.duck=p.h===10;
  const mx=ice?2.3:1.8,a=p.on?(ice?.07:.45):.3;
  if(held.L)p.face=-1;else if(held.R)p.face=1;
  if(held.L&&!p.duck)p.vx-=a;else if(held.R&&!p.duck)p.vx+=a;else p.vx*=p.on?(ice?.985:.7):.93;
  p.vx=clamp(p.vx,-mx,mx);if(Math.abs(p.vx)<.04)p.vx=0;
  if(just.J){
    if(!tm&&p.duck&&standOn('=')){p.drop=10;p.y-=5;p.h=15;p.duck=false;}
    else if(p.on){p.vy=-(p.knee?7.2:5.7);p.on=false;SFX.jump();}
  }
  if(!held.J&&p.vy<-2.2)p.vy=-2.2;
  p.vy=Math.min(p.vy+.32,6.5);if(p.drop>0)p.drop--;
  if(tm){p.x=clamp(p.x+p.vx,10,226);p.y+=p.vy;if(p.y+p.h>=ROOF){p.y=ROOF-p.h;p.vy=0;p.on=true;}else p.on=false;}
  else{move(p,p.vx+(conv?.8:0),p.vy);if(p.hitWall)p.vx=0;}
  if(p.inv>0)p.inv--;if(p.cd>0)p.cd--;
  if(just.SW)switchW();if(held.F&&p.cd<=0)fire();p.an++;
}
function take(i){
  switch(i.t){
    case 'H':p.hp=Math.min(p.max,p.hp+2);flash('+VIDA');break;
    case 'A':p.ammo+=12;flash('+12 MUNICIÓN');break;
    case 'W':{const n=p.has.indexOf(false);if(n>=0){p.has[n]=true;p.wp=n;flash('¡NUEVA ARMA: '+WP[n].n+'!',140);SFX.power();}
      else flash('+20 MUNICIÓN');p.ammo+=20;break;}

function updBoss(e){
  const rage=e.hp<20,sp=rage?1.6:1;e.vx=(Math.sign(e.vx)||-1)*sp;
  e.vy=Math.min(e.vy+.32,7);move(e,e.vx,e.vy);if(e.hitWall)e.vx=-e.vx;

function updEnemies(tm){
  for(const e of en){
    if(e.dead)continue;if(!tm&&!e.boss&&Math.abs(e.x-p.x)>W)continue;

    if(e.truck){if(e.x>e.tx)e.x+=e.vx;else e.x+=Math.sin(e.t*.02)*.7;e.y=e.by+Math.sin(e.t*.06)*10;}
    else if(e.fly){e.x+=e.vx;if(Math.abs(e.x-e.ox)>64)e.vx=-e.vx;e.y=e.by+Math.sin(e.t*.05)*12;}
    else{
      if(e.type==='forklift'){const near=Math.abs(p.x-e.x)<110&&Math.abs(p.y-e.y)<24;e.vx=(Math.sign(e.vx)||-1)*(near?2.1:e.sp);}
      e.vy=Math.min(e.vy+.32,6);move(e,e.vx,e.vy);
      if(e.hitWall)e.vx=-e.vx;
      else if(e.on){const fx=e.vx>0?e.x+e.w+1:e.x-2;if(!solidAt(fx,e.y+e.h+3))e.vx=-e.vx;}
      if(e.y>H+20)e.dead=true;
    }

      const dx=p.x+5-(e.x+e.w/2),dy=p.y+7-(e.y+e.h/2),d=Math.hypot(dx,dy)||1,aim=e.fly||e.truck;
      eb.push({x:e.x+e.w/2-2,y:e.y+(aim?e.h:4),vx:aim?dx/d*2.2:(Math.sign(dx)||-1)*2.2,vy:aim?dy/d*2.2:0,w:5,h:4,l:200,
        c:e.type==='printer'?'#ffffff':e.type==='robot'?'#ffe14a':'#ff5a7a'});

    }

  }

}
function updBullets(){
  for(const b of bl){
    b.x+=b.vx;b.y+=b.vy;b.l--;
    if(isSolid(tile(Math.floor((b.x+2)/T),Math.floor((b.y+1)/T))))b.l=0;
    for(const e of en){
      if(e.dead||b.l<=0)continue;if(e.boss&&!(L&&L.arenaOn))continue;
      if(overlap(b,e)){e.hp-=b.d;e.fl=8;b.l=0;sparks(b.x,b.y,b.c,4);SFX.hit();if(e.hp<=0)kill(e);}
    }
  }

    b.x+=b.vx;b.y+=b.vy;b.l--;
    if(L&&isSolid(tile(Math.floor((b.x+2)/T),Math.floor((b.y+2)/T))))b.l=0;
    if(b.l>0&&overlap(b,p)){b.l=0;hurt(1,b.x);}

function updItems(){

function update(){

function drawDoor(x,y,locked){
  X.fillStyle='#222';X.fillRect(x-2,y-2,20,34);X.fillStyle=locked?'#7a1d1d':'#2f8f4e';X.fillRect(x,y,16,32);
  X.fillStyle=locked?'#a33':'#46c26f';X.fillRect(x+2,y+2,12,12);X.fillRect(x+2,y+16,12,14);X.fillStyle='#ffd23f';X.fillRect(x+12,y+17,2,2);
  X.fillStyle=locked?'#a00':'#0a0';X.fillRect(x-9,y-13,34,10);txt(locked?'ARNÉS':'SALIDA',x+8,y-12,'#fff','center');
}
function drawItems(c){
  for(const i of it){const x=Math.round(i.x-c),y=Math.round(i.y+Math.sin(i.bob)*2);if(x<-20||x>W+20)continue;
    if(i.t==='H')spr('it_H',x,y);else if(i.t==='A')spr('it_A',x,y+1);
    else if(i.t==='W'){X.fillStyle='hsl('+(frame*6%360)+',90%,60%)';X.fillRect(x,y,12,12);X.fillStyle='#222';X.fillRect(x+2,y+2,8,8);txt('!',x+6,y+2,'#fff','center');}
    else{if(frame%20<10){X.fillStyle='rgba(255,230,80,.35)';X.fillRect(x-3,y-3,18,18);}drawHarness(x,y);}
  }
}
function drawBoss(e,c){
  const x=Math.round(e.x-c),y=Math.round(e.y),rage=e.hp<20;
  X.fillStyle='#4a525e';X.fillRect(x+2,y+8,26,16);X.fillStyle='#7c8794';X.fillRect(x+4,y+10,22,12);
  X.fillStyle='#4a525e';X.fillRect(x+7,y,16,9);X.fillStyle=rage?'#ff2a2a':'#ffd23f';X.fillRect(x+9,y+3,4,3);X.fillRect(x+17,y+3,4,3);
  for(let i=0;i<4;i++){X.fillStyle=i%2?'#222':'#f2c200';X.fillRect(x+5+i*5,y+19,5,3);}
  X.fillStyle='#333';X.fillRect(x-3,y+10,5,11);X.fillRect(x+28,y+10,5,11);
  X.fillStyle=frame%6<3?'#6ef0ff':'#fff';X.fillRect(x-3,y+21,3,2);X.fillRect(x+30,y+21,3,2);
  X.fillStyle='#2b2f36';X.fillRect(x+6,y+24,6,6);X.fillRect(x+18,y+24,6,6);
  drawHarness(x+10,y+11);
}
function drawEnemies(c){
  for(const e of en){if(e.dead)continue;const x=e.x-c;if(x<-40||x>W+40)continue;if(e.fl>0&&e.fl%2)continue;
    if(e.boss){if(L&&L.arenaOn||e.x-c<W)drawBoss(e,c);continue;}
    spr(e.type,x,e.y,e.type==='forklift'&&e.vx<0);}
}
function drawPlayer(c){
  if(p.inv>0&&Math.floor(p.inv/3)%2&&state!=='end')return;
  const pre=p.knee?'mk_':'m_';let f='stand';
  if(p.duck)f='duck';else if(!p.on)f='jump';else if(Math.abs(p.vx)>.3&&Math.floor(p.an/7)%2)f='walk';
  const hg=f==='duck'?12:16,x=Math.round(p.x-1-c),y=Math.round(p.y+p.h-hg);spr(pre+f,x,y,p.face<0);
  const w=WP[p.wp],gx=p.face>0?x+10:x-3,gy=y+8;X.fillStyle=w.c;X.fillRect(gx,gy,5,2);X.fillStyle='#333';X.fillRect(gx+(p.face>0?0:3),gy+2,2,2);
  if(p.knee&&frame%10<5){X.fillStyle='#fff';X.fillRect(x+4,y+hg-4,1,1);}
}
function drawShots(c){
  for(const b of bl){X.fillStyle=b.c;X.fillRect(Math.round(b.x-c),Math.round(b.y),b.w,b.h);}
  for(const b of eb){X.fillStyle=b.c;X.fillRect(Math.round(b.x-c),Math.round(b.y),b.w,b.h);X.fillStyle='#000';X.fillRect(Math.round(b.x-c)+1,Math.round(b.y)+1,1,1);}
  for(const q of parts){X.fillStyle=q.c;const s=q.sz||2;X.fillRect(Math.round(q.x-c),Math.round(q.y),s,s);}
}
function drawSnow(c){
  const a=L.cold[0]-c,b=L.cold[1]-c;if(b<0||a>W)return;const l=Math.max(0,a),r=Math.min(W,b);
  X.fillStyle='rgba(140,200,255,.14)';X.fillRect(l,0,r-l,H);X.fillStyle='#fff';
  for(const f of SNOW){f.y+=f.s;f.x+=Math.sin((frame+f.y)*.03)*.3;if(f.y>H){f.y=-2;f.x=rnd()*W;}
    if(f.x>=l&&f.x<=r){const s=f.s>.9?2:1;X.fillRect(f.x|0,f.y|0,s,s);}}
  if(a>-60&&a<W){X.fillStyle='#1d5a8a';X.fillRect(a+4,20,74,12);txt('CÁMARA FRÍA',a+41,22,'#fff','center');}
}
function drawLevel(){
  const c=Math.round(cam);drawBG(L.theme,c);drawTiles(c);
  if(L.exit)drawDoor(L.exit.x-c,L.exit.y,L.lock&&!p.harness);
  if(L.npc){const nx=L.npc.x-c;X.fillStyle='#0b4ea2';X.fillRect(nx-34,98,80,12);txt('RECEPCIÓN',nx+6,100,'#fff','center');
    spr('npc_stand',nx,L.npc.y,true);if(state==='play'&&frame%40<28)txt('!',nx+6,L.npc.y-12-Math.abs(Math.sin(frame*.1))*3,'#ffd23f','center');}
  drawItems(c);drawEnemies(c);drawPlayer(c);drawShots(c);if(L.cold)drawSnow(c);
}
function drawTruck(){
  const g=X.createLinearGradient(0,0,0,150);g.addColorStop(0,'#2b1a4a');g.addColorStop(.6,'#e0607a');g.addColorStop(1,'#ffb36b');
  X.fillStyle=g;X.fillRect(0,0,W,150);X.fillStyle='#ffe08a';X.beginPath();X.arc(250,72,22,0,Math.PI*2);X.fill();
  for(let i=-1;i<6;i++){const bx=i*80-mod(truck.d*.3,80);X.fillStyle='#5a2d5e';X.beginPath();X.moveTo(bx,150);X.lineTo(bx+40,96);X.lineTo(bx+80,150);X.fill();}
  for(let i=-1;i<8;i++){const bx=i*60-mod(truck.d*.8,60);X.fillStyle='#3a1f40';X.beginPath();X.moveTo(bx,150);X.lineTo(bx+30,118);X.lineTo(bx+60,150);X.fill();}
  X.fillStyle='#333';X.fillRect(0,150,W,42);X.fillStyle='#888';X.fillRect(0,146,W,2);
  for(let x=-mod(truck.d*4,24);x<W;x+=24){X.fillStyle='#666';X.fillRect(x,142,2,8);}
  X.fillStyle='#ddd';for(let x=-mod(truck.d*4,32);x<W;x+=32)X.fillRect(x,174,16,2);
  // tráiler y cabina
  X.fillStyle='#e9eef2';X.fillRect(8,118,230,30);X.fillStyle='#0b4ea2';X.fillRect(8,134,230,4);
  txt('ARNESES · JUST IN TIME',123,123,'#0b4ea2','center');X.fillStyle='#222';X.fillRect(8,148,292,4);
  X.fillStyle='#c8102e';X.fillRect(240,104,60,44);X.fillStyle='#9fd3ff';X.fillRect(282,108,14,14);
  X.fillStyle='#999';X.fillRect(298,136,6,10);X.fillStyle='#777';X.fillRect(244,90,4,14);
  for(const wx of [30,52,196,218,262,288]){X.fillStyle='#111';X.beginPath();X.arc(wx,153,7,0,Math.PI*2);X.fill();
    const a=truck.d*.4;X.fillStyle='#888';X.fillRect(Math.round(wx+Math.cos(a)*3)-1,Math.round(153+Math.sin(a)*3)-1,2,2);}
  // puentes bajos
  for(const o of truck.obs){
    X.fillStyle='#565a63';X.fillRect(o.x+6,0,o.w-12,52);X.fillStyle='#6b6f78';X.fillRect(o.x,52,o.w,54);
    X.fillStyle='#4a4e57';X.fillRect(o.x,52,o.w,4);for(let i=0;i<7;i++){X.fillStyle=i%2?'#111':'#f2c200';X.fillRect(o.x+i*4,102,4,4);}}
  drawItems(0);drawEnemies(0);drawPlayer(0);drawShots(0);
  if(truck.obs.some(o=>o.x>p.x&&o.x-p.x<150)&&frame%16<10)txt('¡AGÁCHATE!  ↓',W/2,34,'#ffe14a','center',16);
}
function drawHUD(){
  X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,0,W,13);
  for(let i=0;i<p.max;i++)heart(3+i*9,4,i<p.hp);
  const w=WP[p.wp];txt(w.n+' '+(w.ammo?p.ammo:'∞'),50,3,w.c);
  txt(LV[lvlIdx].name,196,3,'#fff','center');
  if(p.harness)drawHarness(232,1);
  txt(String(score).padStart(6,'0'),W-3,3,'#ffd23f','right');
  if(scene==='truck'&&truck){const pct=Math.min(1,truck.d/truck.goal);
    X.fillStyle='rgba(0,0,0,.5)';X.fillRect(0,13,W,11);txt('A GM',4,14,'#fff');
    X.fillStyle='#555';X.fillRect(32,18,262,2);X.fillStyle='#46c26f';X.fillRect(32,18,262*pct,2);
    X.fillStyle='#c8102e';X.fillRect(32+262*pct-4,15,8,6);X.fillStyle='#0b4ea2';X.fillRect(298,14,16,9);txt('GM',306,14,'#fff','center');}
  if(L&&L.arenaOn){const b=en.find(e=>e.boss);if(b&&!b.dead){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(60,178,200,10);
    X.fillStyle='#e8283c';X.fillRect(62,180,196*b.hp/ED.boss.hp,6);txt('ROBOT DE LÍNEA',W/2,169,'#fff','center');}}
  if(msg&&msg.t>0&&msg.s)txt(msg.s,W/2,48,'#fff','center');
}
function drawStory(){
  const s=story,bx=8,by=H-62,bw=W-16,bh=54;box(bx,by,bw,bh);
  wrap(s.lines[s.i].slice(0,Math.floor(s.c)),bx+8,by+8,bw-16,11);
  if(s.c>=s.lines[s.i].length&&frame%40<26)txt('▼',bx+bw-14,by+bh-13,'#ffd23f');
}
function drawCard(){
  X.fillStyle='#000';X.fillRect(0,0,W,H);
  txt('NIVEL '+(story.lv+1),W/2,24,'#ffd23f','center',16);txt(LV[story.lv].name,W/2,46,'#fff','center',16);
  spr((p&&p.harness?'m_':'m_')+(Math.floor(frame/8)%2?'walk':'stand'),W/2-6,84,false);
  if(p&&p.harness)drawHarness(W/2+10,92);
}
function drawTitle(){
  X.fillStyle='#10121c';X.fillRect(0,0,W,H);
  for(let i=0;i<6;i++){const x=mod(i*70-frame*.3,420)-50;X.fillStyle='#1d2130';X.fillRect(x,40,6,120);X.fillRect(x+54,40,6,120);
    X.fillStyle='#2a2f44';X.fillRect(x,80,60,4);X.fillRect(x,120,60,4);}
  X.fillStyle='#2b2f3a';X.fillRect(0,160,W,32);
  txt('RECUPERAR LA',W/2,16,'#ffffff','center',16);txt('RODILLA DE MIKE',W/2,36,'#ffd23f','center',16);
  const fr=Math.floor(frame/10)%2?'walk':'stand';X.drawImage(SPR['m_'+fr][0],W/2-24,96,48,64);
  if(frame%30<15){X.fillStyle='#fff';X.fillRect(W/2-12,140,3,3);}
  if(frame%60<40)txt('ENTER O TOCA LA PANTALLA',W/2,164,'#fff','center');
  txt('←→ mover  ↓ agachar  Z saltar  X disparar  C arma  M música',W/2,180,'#9aa3b4','center');
}
function drawStats(){
  box(50,40,220,96);txt('¡MIKE TIENE RODILLA NUEVA!',W/2,48,'#ffd23f','center');
  const sec=Math.floor(playFrames/60);
  txt('Tiempo: '+Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'),66,66);
  txt('Enemigos vencidos: '+kills,66,78);txt('Caídas: '+deaths,66,90);txt('Puntos: '+score,66,102);
  if(frame%50<34)txt('ENTER: jugar otra vez',W/2,120,'#9fe8ff','center');
}
function draw(){
  X.setTransform(1,0,0,1,0,0);X.imageSmoothingEnabled=false;
  if(state==='title'){drawTitle();return;}
  if(state==='story'&&story.lv!==undefined){drawCard();drawStory();return;}
  if(shake>0)X.translate(Math.round((rnd()-.5)*4),Math.round((rnd()-.5)*4));
  if(scene==='truck'&&truck)drawTruck();else if(L)drawLevel();
  X.setTransform(1,0,0,1,0,0);drawHUD();
  if(state==='story')drawStory();
  if(state==='pause'){X.fillStyle='rgba(0,0,0,.5)';X.fillRect(0,0,W,H);txt('PAUSA',W/2,80,'#fff','center',16);txt('P / ENTER para seguir',W/2,104,'#ccc','center');}
  if(state==='dead'){X.fillStyle='rgba(60,0,0,.55)';X.fillRect(0,0,W,H);txt('¡AUCH, LA RODILLA!',W/2,70,'#fff','center',16);
    if(frame%50<34)txt('ENTER para reintentar el nivel',W/2,100,'#ffd23f','center');}
  if(state==='end'&&endS&&endS.ph===2)drawStats();
}

/* ---------------- BUCLE ---------------- */
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);acc+=Math.min(100,t-last);last=t;
  while(acc>=1000/60){update();acc-=1000/60;}draw();}
requestAnimationFrame(loop);
</script>
</body>
